name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test backend
        working-directory: backend
        run: gradle :server:test

  web-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: web-admin
        run: npm install
      - name: Build web admin
        working-directory: web-admin
        run: npm run build

  database-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply all database migrations in order
        env:
          PGPASSWORD: ci-only-password
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify Neon bootstrap SQL on a clean database
        env:
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          createdb -h localhost -U postgres furniture_erp_neon_test
          psql -h localhost -U postgres -d furniture_erp_neon_test -v ON_ERROR_STOP=1 -f database/neon-initial-setup.sql

      - name: Validate Render Blueprint YAML syntax
        run: ruby -e "require 'yaml'; YAML.load_file('render.yaml')"

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install uploaded branding assets
        shell: bash
        run: |
          set -euo pipefail
          RES=android-app/app/src/main/res
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/mipmap-xxxhdpi"
          BASE="https://raw.githubusercontent.com/project-bharat/furniture-workshop-erp/main/assets/branding"
          curl -fsSL "$BASE/app-icon-background.png" -o "$RES/drawable-nodpi/app_icon_background.png"
          curl -fsSL "$BASE/app-icon-foreground.png" -o "$RES/drawable-nodpi/app_icon_foreground.png"
          curl -fsSL "$BASE/splash-screen.png" -o "$RES/drawable-nodpi/splash_screen.png"
          curl -fsSL "$BASE/logo-horizontal.png" -o "$RES/drawable-nodpi/logo_horizontal.png"
          curl -fsSL "$BASE/logo-horizontal-dark.png" -o "$RES/drawable-nodpi/logo_horizontal_dark.png"
          curl -fsSL "$BASE/logo-light.png" -o "$RES/drawable-nodpi/logo_light.png"
          curl -fsSL "$BASE/logo-dark.png" -o "$RES/drawable-nodpi/logo_dark.png"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/app_icon_background" />
              <foreground android:drawable="@drawable/app_icon_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/drawable-nodpi/app_icon_foreground.png" "$RES/mipmap-xxxhdpi/ic_launcher.png"
      - name: Assemble Android debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: furniture-workshop-erp-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
