services:
  postgres:
    image: postgres:16-alpine
    container_name: furniture-workshop-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop_erp}
      POSTGRES_USER: ${POSTGRES_USER:-workshop_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - workshop-postgres-data:/var/lib/postgresql/data
      - ../database/migrations/0001_foundation.sql:/docker-entrypoint-initdb.d/001-foundation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $\{POSTGRES_USER} -d $\{POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workshop-postgres-data:
