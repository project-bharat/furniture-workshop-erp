openapi: 3.1.0
info:
  title: Furniture Workshop ERP API
  version: 0.2.0
  description: Versioned REST API shared by the Android and web clients.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Authentication
  - name: Identity
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Service liveness check
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/bootstrap:
    post:
      tags: [Authentication]
      operationId: bootstrapOwner
      summary: Create the first organization, branch and owner account
      description: One-time endpoint protected by the server-side BOOTSTRAP_SECRET. It is disabled when the secret is unset or an organization already exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Owner and organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Bootstrap secret rejected or bootstrap disabled
        '409':
          description: Owner setup already completed
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate by email and create a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked
  /auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Return the authenticated user and current server-side permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrapSecret, organizationName, legalName, ownerName, email, password]
      properties:
        bootstrapSecret: { type: string, writeOnly: true }
        organizationName: { type: string, minLength: 1, maxLength: 160 }
        legalName: { type: string, minLength: 1, maxLength: 200 }
        branchName: { type: string, default: Main Workshop }
        ownerName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        password: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
        deviceLabel: { type: string, nullable: true, maxLength: 120 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
        deviceLabel: { type: string, nullable: true, maxLength: 120 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 40, writeOnly: true }
        deviceLabel: { type: string, nullable: true, maxLength: 120 }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true, writeOnly: true }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, writeOnly: true }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 60, maximum: 3600 }
        refreshExpiresIn: { type: integer }
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, name, organizationId, organizationName, membershipId, role, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        membershipId: { type: string, format: uuid }
        role: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
