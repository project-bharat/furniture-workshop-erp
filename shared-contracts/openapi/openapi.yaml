openapi: 3.1.0
info:
  title: Furniture Workshop ERP API
  version: 0.2.0
  description: Versioned REST API shared by the Android and web clients.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Authentication
  - name: Identity
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Service liveness check
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/bootstrap:
    post:
      tags: [Authentication]
      operationId: bootstrapOwner
      summary: Create the first organization, branch and owner account
      description: One-time endpoint protected by the server-side BOOTSTRAP_SECRET. It is disabled when the secret is unset or an organization already exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Owner and organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Bootstrap secret rejected or bootstrap disabled
        '409':
          description: Owner setup already completed
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate by email and create a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke a refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked
  /auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Return the authenticated user and current server-side permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List active customers in the authenticated organization
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Customer records
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CustomerResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing customers.view permission }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Missing customers.manage permission }
  /customers/{id}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer within the authenticated organization
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Customer record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerResponse' }
        '404': { description: Customer not found }
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update customer details
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '200': { description: Customer updated }
        '404': { description: Customer not found }
    delete:
      tags: [Customers]
      operationId: archiveCustomer
      summary: Soft archive a customer
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Customer archived }
        '404': { description: Customer not found }
  /enquiries:
    get:
      tags: [Customers]
      operationId: listEnquiries
      summary: List enquiries in the authenticated organization
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Enquiry records
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EnquiryResponse' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Customers]
      operationId: createEnquiry
      summary: Create an enquiry for an active customer
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquiryRequest' }
      responses:
        '201':
          description: Enquiry created
          content:
            application/json:
              schema:
                type: object
                required: [id, enquiryNumber, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  enquiryNumber: { type: string }
                  createdAt: { type: string, format: date-time }
        '404': { description: Active customer not found }
  /enquiries/{id}/status:
    patch:
      tags: [Customers]
      operationId: updateEnquiryStatus
      summary: Update enquiry pipeline status
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [NEW, CONTACTED, SITE_VISIT, QUOTATION_PENDING, QUOTED, WON, LOST, ON_HOLD]
      responses:
        '200': { description: Enquiry status updated }
        '404': { description: Enquiry not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        timestamp: { type: string, format: date-time }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [bootstrapSecret, organizationName, legalName, ownerName, email, password]
      properties:
        bootstrapSecret: { type: string, writeOnly: true }
        organizationName: { type: string, minLength: 1, maxLength: 160 }
        legalName: { type: string, minLength: 1, maxLength: 200 }
        branchName: { type: string, default: Main Workshop }
        ownerName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        password: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
        deviceLabel: { type: string, nullable: true, maxLength: 120 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
        deviceLabel: { type: string, nullable: true, maxLength: 120 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 40, writeOnly: true }
        deviceLabel: { type: string, nullable: true, maxLength: 120 }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string, nullable: true, writeOnly: true }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, writeOnly: true }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 60, maximum: 3600 }
        refreshExpiresIn: { type: integer }
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, name, organizationId, organizationName, membershipId, role, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        membershipId: { type: string, format: uuid }
        role: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    CustomerRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 180 }
        customerType: { type: string, enum: [INDIVIDUAL, BUSINESS], default: INDIVIDUAL }
        phone: { type: string, nullable: true, maxLength: 30 }
        alternatePhone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, nullable: true, maxLength: 254 }
        gstin: { type: string, nullable: true, maxLength: 15 }
        notes: { type: string, nullable: true }
    CustomerResponse:
      type: object
      required: [id, displayName, customerType, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        customerType: { type: string }
        phone: { type: string, nullable: true }
        alternatePhone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        gstin: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EnquiryRequest:
      type: object
      required: [customerId, title]
      properties:
        customerId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, nullable: true }
        source: { type: string, enum: [WALK_IN, PHONE, WHATSAPP, WEBSITE, REFERRAL, OTHER] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        expectedValue: { type: number, minimum: 0, nullable: true }
        nextFollowUpAt: { type: string, format: date-time, nullable: true }
    EnquiryResponse:
      type: object
      required: [id, enquiryNumber, customerId, customerName, title, source, status, priority, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        enquiryNumber: { type: string }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        source: { type: string }
        status: { type: string }
        priority: { type: string }
        expectedValue: { type: number, nullable: true }
        nextFollowUpAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
